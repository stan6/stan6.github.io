<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bits</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a class="brand" href="index.html">🟣 Qubit Thinking</a><nav><a href="index.html">Home</a><a class="active" href="bits.html">Bits</a><a href="possibilities.html">Possibilities</a><a href="qubit.html">Qubit</a><a href="measurement.html">Lab</a><a href="challenge.html">Challenge</a></nav></header>
<main class="page"><div class="progress">STEP 1 / 5</div><h1>Meet the <span>bit.</span></h1><p class="lead">A bit is a tiny piece of information with two possible values: 0 or 1.</p>
<div class="experiment"><div class="bit-display" id="bit">0</div><p id="bitText">The bit is currently 0.</p><button class="button" id="switch">SWITCH IT</button></div>
<div class="lesson"><h2>Can you predict the next bit?</h2><div class="sequence"><span>0</span><span>1</span><span>0</span><span>1</span><strong>?</strong></div><div class="choice"><button onclick="guess(0)">0</button><button onclick="guess(1)">1</button></div><p id="feedback" class="feedback"></p></div>
<div class="next"><a class="button" href="possibilities.html">Next: Possibilities →</a></div></main>
<script>
let value=0; document.getElementById('switch').onclick=()=>{value=1-value;document.getElementById('bit').textContent=value;document.getElementById('bitText').textContent='The bit is currently '+value+'.'};
function guess(x){document.getElementById('feedback').textContent=x===0?'✨ Correct! The pattern suggests 0.':'Not quite — the pattern suggests 0. Try noticing what repeats.';}
</script></body></html>
