<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOEN 345 - Software Testing Chatbot</title>
    <style>
        :root {
            --concordia-burgundy: #912338;
            --concordia-gold: #db9a35;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 85vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: var(--concordia-burgundy);
            color: white;
            padding: 1.2rem;
            text-align: center;
            border-bottom: 4px solid var(--concordia-gold);
        }
        .header h2 {
            margin: 0;
            font-size: 1.4rem;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #ffffff;
        }
        .message {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background: #e9ecef;
            color: #212529;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            align-self: flex-start;
            background: var(--concordia-burgundy);
            color: white;
            border-bottom-left-radius: 0;
        }
        .bot-message a {
            color: var(--concordia-gold);
            text-decoration: none;
            font-weight: bold;
        }
        .bot-message a:hover {
            text-decoration: underline;
        }
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .chip {
            background: #f8f9fa;
            color: var(--concordia-burgundy);
            border: 1px solid var(--concordia-burgundy);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: var(--concordia-burgundy);
            color: white;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--concordia-burgundy);
        }
        button {
            padding: 12px 24px;
            margin-left: 10px;
            border: none;
            background: var(--concordia-burgundy);
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #7a1d2f;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>SOEN 345 Assistant</h2>
        <p>Software Testing Q&A</p>
    </div>
    <div class="messages" id="chat-box">
        <div class="message bot-message">
            Hello! I am the SOEN 345 Q&A bot. I can help answer your questions based on past GitHub discussions. 
            <br><br>What do you need help with today?
            <div class="chips-container">
                <div class="chip" onclick="sendChipMessage('Assignments (MP1, MP2)')">Assignments (MP1, MP2)</div>
                <div class="chip" onclick="sendChipMessage('Course Project')">Course Project</div>
                <div class="chip" onclick="sendChipMessage('Class Theories & Knowledge')">Class Theories</div>
                <div class="chip" onclick="sendChipMessage('Other FAQs')">Other FAQs</div>
            </div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Restructured Knowledge Base
    const knowledgeBase = [
        {
            category: "Assignments",
            keywords: ["mp1", "mp2", "mini project", "mini-project", "assignment", "assignments"],
            response: "<strong>Assignment-Related (MP1 & MP2):</strong><br>For the mini-projects, students frequently discuss setup issues and mapping metamorphic relations. You can view the dedicated Q&A thread for MP1 here: <a href='https://github.com/orgs/SOEN345-Fall24/discussions/1' target='_blank'>View MP1 Discussion</a>."
        },
        {
            category: "Project",
            keywords: ["project", "proposal", "progress report", "final presentation", "presentation", "course project"],
            response: "<strong>Project-Related:</strong><br>The course project consists of three main phases: the <em>Project Proposal</em>, the <em>Progress Report</em>, and the <em>Final Presentation</em>. Please ensure you follow the rubric guidelines posted in the main repository for each deliverable phase."
        },
        {
            category: "Theories & Knowledge",
            keywords: ["theory", "theories", "knowledge", "class", "lecture", "concept", "exam", "testing concepts"],
            response: "<strong>Theories & Class Knowledge:</strong><br>If you need clarification on software testing theories taught in class (e.g., test coverage criteria, static analysis, metamorphic testing), we have threads dedicated to conceptual breakdowns. <a href='https://github.com/orgs/SOEN345-fall25/discussions/10' target='_blank'>View Theory Clarification Discussion</a>."
        },
        {
            category: "FAQs",
            keywords: ["faq", "other faqs", "app a", "prompt", "chatgpt", "gpt", "bug", "unit test", "unit tests"],
            response: "<strong>Frequently Asked Questions (FAQs):</strong><br>Here are the two most common technical FAQs:<br><br>1. <em>Designing Prompts (App A):</em> Discussions on structuring instructions to avoid over-refusal. <a href='https://github.com/orgs/SOEN345-WINTER2024/discussions/2' target='_blank'>View App A Discussion</a><br>2. <em>ChatGPT Unit Tests:</em> Comparing bugs found by AI-generated tests vs. manual GitHub issues. <a href='https://github.com/orgs/SOEN345-fall25/discussions/8' target='_blank'>View GPT Bugs Discussion</a>"
        }
    ];

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function sendChipMessage(text) {
        const inputElement = document.getElementById("user-input");
        inputElement.value = text;
        sendMessage();
    }

    function sendMessage() {
        const inputElement = document.getElementById("user-input");
        const messageText = inputElement.value.trim();
        
        if (messageText === "") return;

        appendMessage(messageText, "user-message");
        inputElement.value = "";

        setTimeout(() => {
            const reply = getBotResponse(messageText.toLowerCase());
            appendMessage(reply, "bot-message");
        }, 400);
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chat-box");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.innerHTML = text; 
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotResponse(query) {
        for (let item of knowledgeBase) {
            if (item.keywords.some(keyword => query.includes(keyword))) {
                return item.response;
            }
        }
        return "I'm not sure I understand. Try asking about <strong>Assignments (MP1/MP2)</strong>, the <strong>Course Project</strong>, <strong>Class Theories</strong>, or technical <strong>FAQs</strong>.";
    }
</script>

</body>
</html>
